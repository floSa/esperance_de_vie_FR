name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Synchroniser les dépendances
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Vérifier que les pages se rendent sans erreur
        run: uv run python scripts/check_pages.py

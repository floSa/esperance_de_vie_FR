[project]
name = "esperance-vie-app"
version = "0.2.0"
description = "Application Streamlit d'analyse de l'espérance de vie en France et en Europe, à partir des séries INSEE, Eurostat et Our World in Data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "floSa" }]
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# La racine du dépôt est le paquet de l'app : les tests importent `common`
# et `data` comme le font les pages Streamlit.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["C4", "BLE", "DTZ", "UP", "I"]
ignore = [
    # `dict(...)` est la forme idiomatique des options Plotly : la réécrire en
    # littéral rendrait les appels de tracé nettement moins lisibles.
    "C408",
    # L'année courante est une date locale volontaire — l'app parle de l'année
    # civile française, pas d'un instant UTC.
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# Streamlit expose le thème différemment selon les versions ; le repli doit
# fonctionner quelle qu'en soit la cause.
"common.py" = ["BLE001"]
